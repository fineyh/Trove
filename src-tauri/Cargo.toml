[package]
name = "trove"
version = "0.1.0"
description = "Trove — local-first media collection manager"
authors = ["Trove"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
mime_guess = "2"
dunce = "1"
notify = "6"
walkdir = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

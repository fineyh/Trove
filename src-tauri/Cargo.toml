[package]
name = "trove"
version = "0.6.0"
description = "Trove — local-first media collection manager"
authors = ["Trove"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
mime_guess = "2"
dunce = "1"
notify = "6"
walkdir = "2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = "0.22"
hex = "0.4"
trash = "5"
kamadak-exif = "0.6"
# Audio waveforms (ADR-058): pure Rust decoders, no native deps (ADR-021)
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "pcm", "adpcm", "ogg", "vorbis", "aiff"] }

# Phase 6 — Google PKCE login
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# Phase 6 — .trovebackup export/import
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Phase 6 — auto-updater
tauri-plugin-updater = "2"

# 6.1 — log file (ADR-048)
tauri-plugin-log = "2"
log = "0.4"

# 1.2 — one process per data directory (ADR-046)
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Ole",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
# HEIC through WIC (ADR-060). 0.61 is already in the tree via wry / webview2.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Decoding waveforms unoptimised is ~10x slower; dev builds would crawl (ADR-058).
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3

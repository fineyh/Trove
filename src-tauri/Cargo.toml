[package]
name = "trove"
version = "0.3.0"
description = "Trove — local-first media collection manager"
authors = ["Trove"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
mime_guess = "2"
dunce = "1"
notify = "6"
walkdir = "2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = "0.22"
hex = "0.4"
trash = "5"

# Phase 6 — Google PKCE login
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

# Phase 6 — .trovebackup export/import
tauri-plugin-process = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Phase 6 — auto-updater
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

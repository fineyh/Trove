<!-- Trove app icon, master art. Regenerate every size with `npm run icons`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="640">
      <stop offset="0" stop-color="#5873F2"/>
      <stop offset="1" stop-color="#C6D0FF"/>
    </linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="664" cy="340" r="250">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="520">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="bubble" d="M512 104C846 104 940 180 940 448C940 716 846 792 512 792C178 792 84 716 84 448C84 180 178 104 512 104ZM452 776C392 852 296 902 172 914C140 917 128 892 152 873C204 832 214 770 196 660Z"/>
    <clipPath id="inside"><use href="#bubble"/></clipPath>
  </defs>
  <g clip-path="url(#inside)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="664" cy="340" r="250" fill="url(#halo)"/>
    <circle cx="664" cy="340" r="70" fill="#fff"/>
    <!-- far peaks, then their sunlit faces -->
    <path d="M-40 640L176 462L272 536L408 410L590 586L716 512L850 596L1064 480V1024H-40Z" fill="#7088F4" stroke="#7088F4" stroke-width="30" stroke-linejoin="round"/>
    <path d="M408 410L590 586L716 512L850 596L1064 480V700H470Z" fill="#8DA0FA" stroke="#8DA0FA" stroke-width="30" stroke-linejoin="round"/>
    <!-- two rows of hills -->
    <path d="M0 652C120 612 220 596 330 614C460 636 520 692 640 674C780 652 860 600 1024 612V1024H0Z" fill="#5068E6"/>
    <path d="M0 724C160 704 280 676 420 706C560 736 700 782 1024 720V1024H0Z" fill="#3546C4"/>
    <use href="#bubble" fill="none" stroke="url(#rim)" stroke-width="10"/>
  </g>
</svg>

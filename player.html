<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trove Player</title>
    <style>
      :root {
        --titlebar-h: 32px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      #titlebar {
        display: flex;
        align-items: center;
        height: var(--titlebar-h);
        background: #1b1b1b;
        color: #ddd;
        padding-left: 10px;
      }
      #title {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: var(--titlebar-h);
      }
      #controls {
        display: flex;
        height: 100%;
      }
      #controls button {
        width: 40px;
        height: 100%;
        border: 0;
        background: transparent;
        color: #bbb;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #controls button:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      #close:hover {
        background: #c0392b;
        color: #fff;
      }
      /* Pinned state: highlight the toggle. */
      #pin.active {
        color: #4c8bf5;
      }
      #pin.active:hover {
        color: #4c8bf5;
      }
      #stage {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: calc(100vh - var(--titlebar-h));
        overflow: hidden;
        background: #000;
      }
      #player,
      #image {
        display: none;
        max-width: 100vw;
        max-height: calc(100vh - var(--titlebar-h));
        object-fit: contain;
        background: #000;
        transition: transform 150ms ease;
      }
      #player {
        cursor: pointer;
      }
      /* Custom video controls, anchored to the bottom of the window so they
         stay upright regardless of how the video frame is rotated. */
      #video-controls {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        align-items: center;
        gap: 10px;
        width: min(640px, calc(100vw - 32px));
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 10;
      }
      #video-controls button {
        flex: 0 0 auto;
        width: 32px;
        height: 32px;
        border: 0;
        background: transparent;
        color: #ddd;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
      }
      #video-controls button:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      #video-controls .time {
        flex: 0 0 auto;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: rgba(255, 255, 255, 0.8);
      }
      #vc-seek {
        flex: 1 1 auto;
        height: 4px;
        cursor: pointer;
        accent-color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region>
      <span id="title" data-tauri-drag-region></span>
      <div id="controls">
        <button id="rotate-left" type="button" title="向左旋转">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button id="rotate-right" type="button" title="向右旋转">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
        <button id="pin" type="button" title="置顶">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="17" x2="12" y2="22" />
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z" />
          </svg>
        </button>
        <button id="close" type="button" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>
    <div id="stage">
      <video id="player" autoplay playsinline></video>
      <img id="image" alt="" />
    </div>
    <div id="video-controls">
      <button id="vc-play" type="button" title="播放 / 暂停">
        <svg id="vc-icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="6 3 20 12 6 21 6 3" />
        </svg>
        <svg id="vc-icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display: none">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
      </button>
      <span id="vc-current" class="time">0:00</span>
      <input id="vc-seek" type="range" min="0" max="0" step="any" value="0" title="进度" />
      <span id="vc-duration" class="time">0:00</span>
      <button id="vc-mute" type="button" title="静音">
        <svg id="vc-icon-vol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a7 7 0 0 1 0 14.14" />
        </svg>
        <svg id="vc-icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="22" y1="9" x2="16" y2="15" />
          <line x1="16" y1="9" x2="22" y2="15" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/player/main.ts"></script>
  </body>
</html>
